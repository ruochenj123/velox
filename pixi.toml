[workspace]
channels = ["rapidsai", "conda-forge"]
name = "velox-cudf"
platforms = ["linux-64"]
requires-pixi = ">=0.59"

[dependencies]
# Build tools
cmake = ">=3.30.4"
ninja = "*"
cxx-compiler = "*"
c-compiler = "*"
cuda-nvcc = "*"
cuda-cudart-dev = "*"
cuda-nvml-dev = "*"
libcufile-dev = "*"
make = "*"
sccache = "*"
pkg-config = "*"
autoconf = "*"
automake = "*"
libtool = "*"

# Core Velox dependencies
gflags = "*"
glog = "*"
fmt = "*"
snappy = "*"
lz4 = "*"
zstd = "*"
zlib = "*"
xz = "*"
libevent = "*"
double-conversion = "*"
libprotobuf = "*"
libthrift = ">=0.11"
boost-cpp = ">=1.77"
icu = "*"
openssl = "*"
libcurl = "*"

# Arrow (needed for cuDF integration)
libarrow = "*"

# Additional
bison = "*"
flex = "*"
wget = "*"
cuda-nvrtc-dev = ">=12.9.86,<13"
libnvjitlink-dev = ">=12.9.86,<13"
cuda-crt = ">=12.9.86,<13"
libsodium = ">=1.0.22,<2"
libdwarf-dev = ">=2.1.0,<3"
libunwind = ">=1.8.3,<2"
elfutils = ">=0.194,<0.195"
libpsl = ">=0.21.5,<0.22"

[feature.cuda12.system-requirements]
cuda = "12"

[feature.cuda12.dependencies]
cuda-version = "12.*"

[feature.cuda12.activation.env]
CUDAARCHS = "80"

[environments]
default = ["cuda12"]
